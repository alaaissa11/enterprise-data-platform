services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: data_user
      POSTGRES_PASSWORD: data_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../data/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../data/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
   postgres_data:  
